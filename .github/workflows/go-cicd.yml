
name: Go CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'

      - name: Load env vars from secret
        run: echo "${{ secrets.ENV_FILE }}" >> $GITHUB_ENV
 

      - name: Build binary
        run: go build 

 